# Smithery configuration for MemoryGuard MCP server
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    description: MemoryGuard MCP server configuration
  command: python
  args:
    - -m
    - memoryguard.mcp_server
displayName: MemoryGuard
description: >
  Local-first MCP memory backend and governance console for coding agents.
  Auto-organize, quarantine, supersede, and rollback shared memories.
  22 MCP tools. SQLite backend. No account, no server, no telemetry.
homepage: https://github.com/irisxc4/memoryguard
repository: https://github.com/irisxc4/memoryguard
license: MIT
keywords:
  - mcp
  - memory
  - agent
  - governance
  - claude
  - cursor
  - codex
  - local-first
