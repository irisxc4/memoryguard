<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#08121F"/>
  
  <!-- Subtle grid -->
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#12243A" stroke-width="1"/>
  <line x1="0" y1="480" x2="1280" y2="480" stroke="#12243A" stroke-width="1"/>
  
  <!-- Logo mark: shield-like governance icon -->
  <rect x="80" y="120" width="8" height="400" rx="4" fill="#38D5C8"/>
  
  <!-- Title -->
  <text x="120" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#EEF4F8">MemoryGuard</text>
  
  <!-- Tagline EN -->
  <text x="120" y="260" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#38D5C8">Shared memory for coding agents.</text>
  <text x="120" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#EEF4F8">Under control.</text>
  
  <!-- Feature pills -->
  <rect x="120" y="360" width="180" height="40" rx="20" fill="#12243A"/>
  <text x="210" y="386" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#38D5C8" text-anchor="middle">Local MCP</text>
  
  <rect x="320" y="360" width="160" height="40" rx="20" fill="#12243A"/>
  <text x="400" y="386" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#F3B562" text-anchor="middle">Auto-organize</text>
  
  <rect x="500" y="360" width="140" height="40" rx="20" fill="#12243A"/>
  <text x="570" y="386" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#EEF4F8" text-anchor="middle">Rollback</text>
  
  <rect x="660" y="360" width="120" height="40" rx="20" fill="#12243A"/>
  <text x="720" y="386" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#EA6A6A" text-anchor="middle">Quarantine</text>
  
  <!-- Install hint -->
  <rect x="120" y="440" width="380" height="44" rx="6" fill="#0D1B2A" stroke="#1E3A52" stroke-width="1"/>
  <text x="140" y="468" font-family="'Cascadia Code', 'Consolas', monospace" font-size="18" fill="#38D5C8">$</text>
  <text x="166" y="468" font-family="'Cascadia Code', 'Consolas', monospace" font-size="18" fill="#EEF4F8">pip install agent-memguard</text>
  
  <!-- Right side: mini governance visual -->
  <g transform="translate(820, 140)">
    <rect width="380" height="360" rx="8" fill="#0D1B2A" stroke="#1E3A52" stroke-width="1"/>
    <rect width="380" height="36" rx="8" fill="#12243A"/>
    
    <!-- Event rows -->
    <rect x="16" y="56" width="348" height="44" rx="4" fill="#12243A"/>
    <rect x="24" y="66" width="6" height="24" rx="2" fill="#38D5C8"/>
    <rect x="40" y="70" width="200" height="8" rx="2" fill="#3E556B"/>
    <rect x="40" y="84" width="120" height="6" rx="2" fill="#2A3F55"/>
    
    <rect x="16" y="112" width="348" height="44" rx="4" fill="#12243A"/>
    <rect x="24" y="122" width="6" height="24" rx="2" fill="#F3B562"/>
    <rect x="40" y="126" width="180" height="8" rx="2" fill="#3E556B"/>
    <rect x="40" y="140" width="100" height="6" rx="2" fill="#2A3F55"/>
    
    <rect x="16" y="168" width="348" height="44" rx="4" fill="#1A1212" stroke="#3A2020" stroke-width="1"/>
    <rect x="24" y="178" width="6" height="24" rx="2" fill="#EA6A6A"/>
    <rect x="40" y="182" width="160" height="8" rx="2" fill="#3E556B"/>
    <rect x="40" y="196" width="90" height="6" rx="2" fill="#2A3F55"/>
    
    <rect x="16" y="232" width="348" height="44" rx="4" fill="#12243A"/>
    <rect x="24" y="242" width="6" height="24" rx="2" fill="#38D5C8"/>
    <rect x="40" y="246" width="140" height="8" rx="2" fill="#3E556B"/>
    <rect x="40" y="260" width="80" height="6" rx="2" fill="#2A3F55"/>
    
    <!-- Status bar -->
    <rect x="16" y="296" width="100" height="28" rx="14" fill="#1A3340"/>
    <circle cx="32" cy="310" r="5" fill="#38D5C8"/>
    <rect x="44" y="304" width="56" height="12" rx="2" fill="#3E556B"/>
  </g>
</svg>
