[project]
name = "agent-memguard"
version = "0.7.7"
description = "Local-first MCP memory backend and governance console for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MemoryGuard Contributors" }]
keywords = ["agent", "governance", "memory", "mcp", "skill", "local-first", "claude", "cursor", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
# 首期零运行时第三方依赖：纯标准库实现，保证无网络、无供应链风险。
dependencies = [
    # Python 3.10 lacks the stdlib tomllib (added in 3.11); use the tomli
    # backport so the declared requires-python >=3.10 contract holds.
    "tomli>=2.0.1; python_version < '3.11'",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-zig>=1.0,<2.0",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-bash>=0.23,<0.27",
]

[project.urls]
Homepage = "https://github.com/irisxc4/memoryguard"
Repository = "https://github.com/irisxc4/memoryguard"
Documentation = "https://github.com/irisxc4/memoryguard#readme"
Issues = "https://github.com/irisxc4/memoryguard/issues"

[project.scripts]
memoryguard = "memoryguard.cli:main"
memoryguard-v2 = "memoryguard.v2_cli:main"

[project.gui-scripts]
memoryguard-gui = "memoryguard.cli:gui_main"

[project.optional-dependencies]
# 原生桌面窗口 GUI（可选）。未安装时 `open` 自动降级到 localhost/HTML。
# 引入理由: 用户需求要求原生窗口；保持可选以维持 Core 零依赖原则（spec §1.3/§10）。
gui = ["pywebview>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memoryguard = ["static/*.js", "static/*.png", "static/*.ico"]
"memoryguard.graphify_core" = ["LICENSE.graphify.txt", "NOTICE.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
