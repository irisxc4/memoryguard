[project]
name = "memoryguard"
version = "0.1.0"
description = "Local-first Agent governance Skill + CLI + GUI"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MemoryGuard Contributors" }]
keywords = ["agent", "governance", "memory", "rag", "skill", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# 首期零运行时第三方依赖：纯标准库实现，保证无网络、无供应链风险。
# 仅在确有需要时（如 HTML 模板引擎、YAML 解析）再按可选依赖引入。
dependencies = []

[project.scripts]
memoryguard = "memoryguard.cli:main"

[project.optional-dependencies]
# 原生桌面窗口 GUI（可选）。未安装时 `open` 自动降级到 localhost/HTML。
# 引入理由: 用户需求要求原生窗口；保持可选以维持 Core 零依赖原则（spec §1.3/§10）。
gui = ["pywebview>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
